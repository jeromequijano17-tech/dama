<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dama Arena</title><link rel="stylesheet" href="/style.css"></head><body><div id="app"><header><div><h1>♟ DAMA ARENA</h1><small>Two-player Philippine-style checkers</small></div><div id="userBox"></div></header><main><section id="auth" class="card"><div class="tabs"><button onclick="showAuth('login')">Login</button><button onclick="showAuth('register')">Register</button></div><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="authSubmit()" id="authBtn">Login</button><p id="authMsg"></p></section><section id="lobby" class="hidden"><div class="card hero"><h2>Play Dama</h2><p>Create a room and share the code, or join an existing game.</p><input id="roomCode" placeholder="ROOM CODE"><button class="primary" onclick="createRoom()">Create / Join Room</button><button onclick="showPanel('leader')">Leaderboard</button><button onclick="showPanel('history')">History</button></div><div id="panel"></div></section><section id="game" class="hidden"><div class="gamebar card"><span id="roomLabel"></span><strong id="turnLabel"></strong><button onclick="resign()">Resign</button><button onclick="offerDraw()">Draw</button></div><div class="gamegrid"><div class="card boardwrap"><div id="board"></div><div id="status"></div></div><aside class="card side"><h3>Players</h3><div id="players"></div><h3>Chat</h3><div id="chat"></div><input id="chatInput" placeholder="Message" onkeydown="if(event.key==='Enter')sendChat()"></aside></div></section></main></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
